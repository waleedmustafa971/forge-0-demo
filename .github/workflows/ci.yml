name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Typecheck and defect contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      # The service carries twelve planted defects, so twelve tests fail on main. A FORGE-0 fix PR
      # (branch forge0/*) must repair exactly one of them and break nothing.
      - name: Exactly the twelve planted defects fail (eleven on a FORGE-0 fix PR)
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}  # ref_name: dispatched on the branch
        run: |
          node --test --test-reporter=tap "test/**/*.test.ts" > tap.txt || true
          failed=$(grep -cE '^    not ok' tap.txt || true)
          passed=$(grep -cE '^    ok' tap.txt || true)
          echo "passed=$passed failed=$failed"
          expected=12
          case "$HEAD_REF" in forge0/*) expected=11 ;; esac
          test "$failed" -eq "$expected" && test "$passed" -eq $((43 - expected))
