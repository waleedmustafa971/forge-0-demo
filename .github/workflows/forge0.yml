# FORGE-0 on this service: label an issue `forge0` and name a failing test in its body with a line
# like "Failing test: <test name>". FORGE-0 investigates on Muse Spark 1.3 and opens a pull request
# whose description is the evidence, if its fix passes independent verification; otherwise it
# comments the evidence on the issue. Only collaborators can add labels, so only they start runs.
name: FORGE-0

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write  # dispatch CI on the fix branch

concurrency:
  group: forge0-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  investigate:
    if: github.event.label.name == 'forge0'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Side by side, so FORGE-0's own files never become part of the snapshot it investigates.
      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: target

      - name: Check out FORGE-0's hackathon work
        uses: actions/checkout@v4
        with:
          repository: waleedmustafa971/forge-0-hackathon
          path: forge0-hackathon
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # assemble.py clones the pre-hackathon core, applies the hackathon work and checks the result.
      - name: Assemble and install FORGE-0
        run: |
          python forge0-hackathon/assemble.py --out forge0
          pip install ./forge0/backend
          docker pull node:24-alpine

      - name: Describe the issue
        env:
          # Passed through the environment, never interpolated into the script.
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: printf '%s\n\n%s\n' "$ISSUE_TITLE" "$ISSUE_BODY" > "$RUNNER_TEMP/issue.md"

      - name: Investigate with FORGE-0
        working-directory: target
        env:
          GH_TOKEN: ${{ github.token }}
          AI_PROVIDER: meta
          META_API_KEY: ${{ secrets.META_API_KEY }}
          META_MODEL: muse-spark-1.3
          AI_MAX_TOKENS: "8192"
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config --global --add safe.directory "$PWD"
          forge0-ci --repo . --report-dir "$RUNNER_TEMP/forge0-report" --open-pr \
            --base "${{ github.event.repository.default_branch }}" \
            --issue-body-file "$RUNNER_TEMP/issue.md" --comment-issue "$ISSUE_NUMBER"

      # A pull request opened with the workflow's own token starts no `pull_request` workflows
      # (GitHub records a failed run with no jobs instead), so CI is dispatched on the fix branch:
      # workflow_dispatch is the one event that token may trigger.
      - name: Run CI on the fix branch
        working-directory: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch=$(git branch --show-current)
          case "$branch" in
            forge0/*) gh workflow run "ci.yml" --ref "$branch" && echo "Dispatched ci.yml on $branch" ;;
            *) echo "No fix branch: nothing to check" ;;
          esac

      - name: Upload the evidence report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge0-evidence-report
          path: ${{ runner.temp }}/forge0-report
          if-no-files-found: ignore
